<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pull the Bows!</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: #fdf6f0;
      background-image:
        radial-gradient(circle at 20% 20%, #fde8f0 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, #f5e8f8 0%, transparent 50%);
      font-family: 'Nunito', sans-serif;
      padding-bottom: 80px;
    }

    nav {
      background-color: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid rgba(230, 170, 190, 0.4);
      padding: 16px;
      text-align: center;
      letter-spacing: 0.04em;
    }

    nav span {
      color: #d4a0b0;
      margin: 0 6px;
    }

    nav a {
      font-size: 0.85rem;
      font-weight: 600;
      color: #c0607a;
      text-decoration: none;
      padding: 4px 6px;
      border-radius: 4px;
      transition: color 0.2s, background-color 0.2s;
    }

    nav a:hover {
      color: #8b3a52;
      background-color: rgba(230, 170, 190, 0.25);
    }

    header {
      text-align: center;
      padding: 40px 20px 12px;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: #c0607a;
      text-shadow: 1px 2px 8px rgba(192,96,122,0.18);
    }

    .subtitle {
      color: #b08898;
      font-weight: 300;
      margin-top: 8px;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    .bows-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 60px 70px;
      padding: 50px 40px 20px;
    }

    .bow-wrapper {
      position: relative;
      user-select: none;
    }

    .bow-wrapper svg {
      overflow: visible;
    }

    .bow-label {
      position: absolute;
      bottom: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      white-space: nowrap;
      font-weight: 600;
      letter-spacing: 0.03em;
      opacity: 0.8;
    }

    .sparkle {
      position: absolute;
      font-size: 1.2rem;
      pointer-events: none;
      animation: sparkle-pop 0.9s ease-out forwards;
    }

    @keyframes sparkle-pop {
      0%   { opacity: 1; transform: translate(0, 0) scale(0.5); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3); }
    }

    .prompts-section {
      text-align: center;
      padding: 70px 20px 20px;
    }

    .prompts-title {
      font-family: 'Dancing Script', cursive;
      font-size: 2rem;
      color: #c0607a;
      text-shadow: 1px 2px 6px rgba(192, 96, 122, 0.15);
      margin-bottom: 28px;
    }

    .ribbon-scroll {
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .ribbon-svg {
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 6px 14px rgba(192, 96, 122, 0.25));
    }

    .ribbon-text {
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <span>|</span>
    <a href="portfolio.html">Portfolio</a>
    <span>|</span>
    <a href="activities.html">Activities</a>
    <span>|</span>
    <a href="qualifications.html">Qualifications</a>
    <span>|</span>
    <a href="sandbox.html">Sandbox</a>
  </nav>

  <header>
    <h1>pull a bow</h1>
    <p class="subtitle">drag the ribbon tails downward ✨</p>
  </header>

  <div class="bows-grid" id="bows-grid"></div>

  <section class="prompts-section">
    <div class="ribbon-scroll">
      <svg class="ribbon-svg" width="7500" height="260" viewBox="0 0 7500 260" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f0b8c8"/>
            <stop offset="100%" stop-color="#d4849c"/>
          </linearGradient>
        </defs>
        <path id="ribbonPath"
          d="M 0,130 C 375,20 750,20 1125,130 C 1500,240 1875,240 2250,130 C 2625,20 3000,20 3375,130 C 3750,240 4125,240 4500,130 C 4875,20 5250,20 5625,130 C 6000,240 6375,240 6750,130 C 7125,20 7500,20 7500,130"
          fill="none" stroke="url(#ribbonGrad)" stroke-width="90" stroke-linecap="round"/>
        <path
          d="M 0,130 C 375,20 750,20 1125,130 C 1500,240 1875,240 2250,130 C 2625,20 3000,20 3375,130 C 3750,240 4125,240 4500,130 C 4875,20 5250,20 5625,130 C 6000,240 6375,240 6750,130 C 7125,20 7500,20 7500,130"
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
      </svg>
    </div>
  </section>

  <script>
    const BOW_COLORS = [
      { main: '#e8a0b4', dark: '#c0607a', light: '#f9dce5' },
      { main: '#f0b8c8', dark: '#d4849c', light: '#fde8f0' },
      { main: '#c8a8d8', dark: '#9068a8', light: '#edd8f8' },
      { main: '#f0c8a0', dark: '#c08858', light: '#faebd7' },
      { main: '#a8c8e8', dark: '#5880b8', light: '#d8eef8' },
      { main: '#c8e0a8', dark: '#689048', light: '#e4f0d4' },
    ];

    const LABELS = ['untie me!', 'pull here~', 'go on...', 'i dare you ✨', 'gently...', 'try me~'];

    const TIED = {
      loopL: 'M 80,82 C 68,60 22,38 30,76 C 38,114 68,98 80,82 Z',
      loopR: 'M 80,82 C 92,60 138,38 130,76 C 122,114 92,98 80,82 Z',
      tailL: 'M 75,88 C 66,114 55,142 48,178',
      tailR: 'M 85,88 C 94,114 105,142 112,178',
    };
    const UNTIED = {
      loopL: 'M 80,82 C 80,82 80,82 80,82 C 80,82 80,82 80,82 Z',
      loopR: 'M 80,82 C 80,82 80,82 80,82 C 80,82 80,82 80,82 Z',
      tailL: 'M 75,88 C 73,130 71,168 69,220',
      tailR: 'M 85,88 C 87,130 89,168 91,220',
    };

    function parseNums(d) { return d.match(/-?\d+\.?\d*/g).map(Number); }
    function buildPath(template, nums) {
      let i = 0;
      return template.replace(/-?\d+\.?\d*/g, () => nums[i++].toFixed(1));
    }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function lerpNums(a, b, t) { return a.map((v, i) => lerp(v, b[i], t)); }

    const PARSED = {};
    for (const key of ['loopL', 'loopR', 'tailL', 'tailR']) {
      PARSED[key] = { tied: parseNums(TIED[key]), untied: parseNums(UNTIED[key]), tmpl: TIED[key] };
    }

    const TAIL_WIDTH = 14;
    const NOTCH_DEPTH = 18;

    function updateTail(svg, side, p) {
      const key = 'tail' + side;
      const tied = PARSED[key].tied;
      const untied = PARSED[key].untied;
      // start = knot end (index 0,1), end = tip (index 6,7) of the M/C path numbers
      const startX = lerp(tied[0], untied[0], p);
      const startY = lerp(tied[1], untied[1], p);
      const endX = lerp(tied[6], untied[6], p);
      const endY = lerp(tied[7], untied[7], p);

      const dx = endX - startX, dy = endY - startY;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;      // direction along the tail
      const px = -uy, py = ux;                  // perpendicular (ribbon width direction)
      const halfW = TAIL_WIDTH / 2;

      const leftTopX = startX + px * halfW, leftTopY = startY + py * halfW;
      const rightTopX = startX - px * halfW, rightTopY = startY - py * halfW;
      const leftTipX = endX + px * halfW, leftTipY = endY + py * halfW;
      const rightTipX = endX - px * halfW, rightTipY = endY - py * halfW;
      // apex sits back along the centerline from the tip, carving the V into the outline itself
      const apexX = endX - ux * NOTCH_DEPTH, apexY = endY - uy * NOTCH_DEPTH;

      const ribbonPath = `M ${leftTopX.toFixed(1)},${leftTopY.toFixed(1)} `
        + `L ${leftTipX.toFixed(1)},${leftTipY.toFixed(1)} `
        + `L ${apexX.toFixed(1)},${apexY.toFixed(1)} `
        + `L ${rightTipX.toFixed(1)},${rightTipY.toFixed(1)} `
        + `L ${rightTopX.toFixed(1)},${rightTopY.toFixed(1)} Z`;

      const tailEl = svg.querySelector('#tail' + side);
      if (tailEl) tailEl.setAttribute('d', ribbonPath);

      // highlight stripe stops at the apex so it doesn't cross the open notch
      const stripeEl = svg.querySelector('#stripe' + side);
      if (stripeEl) stripeEl.setAttribute('d', `M ${startX.toFixed(1)},${startY.toFixed(1)} L ${apexX.toFixed(1)},${apexY.toFixed(1)}`);
    }

    function applyProgress(svg, p) {
      for (const key of ['loopL', 'loopR']) {
        const el = svg.querySelector('#' + key);
        if (el) el.setAttribute('d', buildPath(PARSED[key].tmpl, lerpNums(PARSED[key].tied, PARSED[key].untied, p)));
      }
      updateTail(svg, 'L', p);
      updateTail(svg, 'R', p);
      const knot = svg.querySelector('#knot');
      if (knot) {
        const s = 1 - p;
        knot.setAttribute('transform', `translate(80,82) scale(${s}) translate(-80,-82)`);
        knot.style.opacity = 1 - p;
      }
    }

    function spawnSparkles(wrapper) {
      const emojis = ['✨', '💕', '🎀', '⭐', '💖', '🌸'];
      for (let i = 0; i < 10; i++) {
        const span = document.createElement('span');
        span.className = 'sparkle';
        span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        const dx = (Math.random() - 0.5) * 140;
        const dy = -70 - Math.random() * 90;
        span.style.setProperty('--dx', dx + 'px');
        span.style.setProperty('--dy', dy + 'px');
        span.style.left = (30 + Math.random() * 100) + 'px';
        span.style.top  = (30 + Math.random() * 80)  + 'px';
        span.style.animationDelay = (Math.random() * 0.3) + 's';
        wrapper.appendChild(span);
        setTimeout(() => span.remove(), 1400);
      }
    }

    function createBow(color, label, index) {
      const wrapper = document.createElement('div');
      wrapper.className = 'bow-wrapper';

      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 160 230');
      svg.setAttribute('width', '160');
      svg.setAttribute('height', '230');
      svg.style.filter = `drop-shadow(0 4px 14px ${color.dark}44)`;

      svg.innerHTML = `
        <defs>
          <filter id="sh${index}">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="${color.dark}" flood-opacity="0.25"/>
          </filter>
        </defs>
        <path id="tailL" fill="${color.main}" stroke="${color.dark}" stroke-width="1" stroke-opacity="0.3" filter="url(#sh${index})"/>
        <path id="stripeL" fill="none" stroke="${color.light}" stroke-width="4" stroke-linecap="round"/>
        <path id="tailR" fill="${color.main}" stroke="${color.dark}" stroke-width="1" stroke-opacity="0.3" filter="url(#sh${index})"/>
        <path id="stripeR" fill="none" stroke="${color.light}" stroke-width="4" stroke-linecap="round"/>
        <path id="loopL" d="${TIED.loopL}" fill="${color.main}" stroke="${color.dark}" stroke-width="1.5" filter="url(#sh${index})"/>
        <path id="loopR" d="${TIED.loopR}" fill="${color.main}" stroke="${color.dark}" stroke-width="1.5" filter="url(#sh${index})"/>
        <path d="M 58,58 C 52,50 48,62 54,66" fill="none" stroke="${color.light}" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
        <path d="M 102,58 C 108,50 112,62 106,66" fill="none" stroke="${color.light}" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
        <ellipse id="knot" cx="80" cy="82" rx="13" ry="10" fill="${color.dark}"/>
        <ellipse cx="77" cy="80" rx="4" ry="3" fill="${color.light}" opacity="0.5"/>
        <rect id="handle" x="45" y="105" width="70" height="100" rx="12" fill="transparent" style="cursor:grab"/>
      `;

      wrapper.appendChild(svg);
      applyProgress(svg, 0);

      // Drag logic
      let progress = 0;
      let drag = null;
      let raf = null;
      let popped = false;

      function animateTo(from, to, duration = 500) {
        const start = performance.now();
        cancelAnimationFrame(raf);
        function tick(now) {
          const t = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          progress = lerp(from, to, eased);
          applyProgress(svg, progress);
          if (t < 1) raf = requestAnimationFrame(tick);
        }
        raf = requestAnimationFrame(tick);
      }

      const handle = svg.querySelector('#handle');

      handle.addEventListener('mousedown', e => {
        e.preventDefault();
        drag = { startY: e.clientY, startProgress: progress };
        cancelAnimationFrame(raf);
      });
      handle.addEventListener('touchstart', e => {
        e.preventDefault();
        drag = { startY: e.touches[0].clientY, startProgress: progress };
        cancelAnimationFrame(raf);
      }, { passive: false });

      window.addEventListener('mousemove', e => {
        if (!drag) return;
        const dy = e.clientY - drag.startY;
        progress = Math.max(0, Math.min(1, drag.startProgress + dy / 130));
        applyProgress(svg, progress);
        if (progress >= 1 && !popped) { popped = true; spawnSparkles(wrapper); }
      });
      window.addEventListener('touchmove', e => {
        if (!drag) return;
        const dy = e.touches[0].clientY - drag.startY;
        progress = Math.max(0, Math.min(1, drag.startProgress + dy / 130));
        applyProgress(svg, progress);
        if (progress >= 1 && !popped) { popped = true; spawnSparkles(wrapper); }
      }, { passive: false });
      window.addEventListener('mouseup', () => {
        if (!drag) return;
        drag = null;
        if (progress < 0.95) animateTo(progress, 0);
      });
      window.addEventListener('touchend', () => {
        if (!drag) return;
        drag = null;
        if (progress < 0.95) animateTo(progress, 0);
      });

      return wrapper;
    }

    const grid = document.getElementById('bows-grid');
    BOW_COLORS.forEach((color, i) => {
      grid.appendChild(createBow(color, LABELS[i], i));
    });
  </script>
</body>
</html>
